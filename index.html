<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie Express</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🍔 FOODIE EXPRESS</h1>
    <p>Delicious Food at Affordable Prices!</p>
</header>

<nav>
    <button id="menuTab" class="active" onclick="showPage('menuPage')">
        Food Menu
    </button>

    <button id="cartTab" onclick="showPage('cartPage')">
        Shopping Cart (<span id="cartCount">0</span>)
    </button>
</nav>

<main class="container">

    <!-- PAGE 1: FOOD MENU -->
    <section id="menuPage" class="page active">
        <h2>Our Food Menu</h2>
        <div class="menu" id="menu"></div>

        <button class="back-btn" onclick="showPage('cartPage')">
            Go to Shopping Cart →
        </button>
    </section>

    <!-- PAGE 2: SHOPPING CART -->
    <section id="cartPage" class="page">
        <h2>🛒 Your Shopping Cart</h2>

        <div class="cart-box">
            <div id="cartItems">
                <p>Your shopping cart is empty.</p>
            </div>

            <div class="total">
                Total: ₱<span id="total">0.00</span>
            </div>

            <button class="back-btn" onclick="showPage('menuPage')">
                ← Back to Food Menu
            </button>
        </div>

        <div class="cart-box customer">
            <h2>Customer Information</h2>

            <input type="text" id="customerName"
                placeholder="Enter your full name">

            <input type="text" id="address"
                placeholder="Enter your address">

            <input type="tel" id="phone"
                placeholder="Enter your phone number">

            <select id="payment">
                <option value="">Select Payment Method</option>
                <option>Cash on Delivery</option>
                <option>GCash (Demo Only)</option>
            </select>

            <button class="checkout-btn" onclick="checkout()">
                Place Order
            </button>
        </div>
    </section>

</main>

<footer>
    <p>© 2026 Foodie Express | Food Ordering System</p>
</footer>

<script src="script.js"></script>
</body>
</html>
